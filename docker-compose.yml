services:

  db:
    image: postgres:15-alpine
    container_name: welcomehelper_db
    environment:
      POSTGRES_DB: welcomehelper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    networks:
      - welcomehelper_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: welcomehelper_server
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: welcomehelper
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - welcomehelper_network
    volumes:
      - uploads_data:/app/uploads

  client:
    build: ./client
    container_name: welcomehelper_client
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - welcomehelper_network

volumes:
  postgres_data:
  uploads_data:

networks:
  welcomehelper_network:
    driver: bridge
    